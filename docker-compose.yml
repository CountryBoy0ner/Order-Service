services:
  order-db:
    image: postgres:16-alpine
    container_name: order-service-db
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
    ports:
      - "5434:5432"
    volumes:
      - order_pgdata:/var/lib/postgresql/data
    networks:
      - innowise-micro-net

  kafka:
    image: apache/kafka-native:3.8.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - innowise-micro-net

  order-service:
    build: .
    image: order-service:latest
    container_name: order-service
    depends_on:
      - order-db
      - kafka
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      USER_SERVICE_BASE_URL: "http://user-service:8080/api/users"

      # ВАЖНО: из контейнера ходим на kafka:9093
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
    networks:
      - innowise-micro-net

  kafka-ui:
    image: kafbat/kafka-ui:main
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9093"
    depends_on:
      - kafka
    networks:
      - innowise-micro-net

volumes:
  order_pgdata:

networks:
  innowise-micro-net:
    external: true
